# The site keeps itself current.
#
# Weekly it regenerates the data driven wire articles, refreshes Google ratings
# where a key is configured, rebuilds, and commits. The commit is what triggers
# the Netlify deploy, so nothing here talks to Netlify directly.
#
# Two things are deliberately NOT automated:
#   - Publishing scraped businesses. scripts/scrape.mjs writes to an inbox and a
#     person promotes them, because an unreviewed scraped row is how a directory
#     fills up with businesses that closed years ago.
#   - Writing opinions. scripts/generate-wire.mjs only does arithmetic over the
#     listings, which is why its output can ship without review.
name: refresh

on:
  schedule:
    # 06:00 Monday, Sydney time, which is 20:00 Sunday UTC in winter.
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      places:
        description: 'Also refresh Google ratings'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Expires anything past Google's 30 day caching limit even when no key is
      # set, so a stale rating can never survive a refresh.
      - name: Refresh Google ratings
        if: github.event_name == 'schedule' || inputs.places
        run: node scripts/fetch-places.mjs
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Regenerate the data driven articles
        run: node scripts/generate-wire.mjs

      - name: Rebuild the listing index
        run: node scripts/ingest-businesses.mjs

      - name: Build and verify
        run: npm run build && npm run verify
        env:
          SITE_URL: https://localsknow.com.au

      - name: Tell the search engines
        run: node scripts/indexnow.mjs
        env:
          SITE_URL: https://localsknow.com.au
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Smoke test what is currently live
        continue-on-error: true
        run: node scripts/smoke.mjs --site=https://localsknow.com.au

      - name: Commit whatever changed
        run: |
          git config user.name "localknows-bot"
          git config user.email "bot@localsknow.com.au"
          git add src/data public
          if git diff --staged --quiet; then
            echo "nothing changed this week"
            exit 0
          fi
          git commit -m "Weekly refresh: $(date -u +%Y-%m-%d)

          Regenerated the data driven wire articles and refreshed ratings.
          Generated by .github/workflows/refresh.yml."
          git push
