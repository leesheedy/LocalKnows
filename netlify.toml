# LocalsKnow. Static Astro build, headers and redirects are generated into
# dist/ by scripts/postbuild.mjs so they stay in step with what was actually
# rendered. Anything set here is a floor, not the whole story.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Deploy previews and branch builds must never be indexed. Production sets its
# own robots policy per page, from src/lib/indexability.ts.
[context.deploy-preview]
  [context.deploy-preview.environment]
    SITE_URL = "https://deploy-preview.localsknow.com.au"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Trailing slash normalisation is NOT declared here.
#
# Netlify already 301s /nsw to /nsw/ for directory output, and a rule that says
# so explicitly matches the already slashed path as well, which turns the two
# most important hub pages on the site into an infinite redirect loop. It shipped
# that way once. scripts/smoke.mjs now checks the live sitemap after every deploy
# so it cannot ship that way again.

[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/feed"
  to = "/wire/rss.xml"
  status = 301

[[redirects]]
  from = "/rss"
  to = "/wire/rss.xml"
  status = 301
