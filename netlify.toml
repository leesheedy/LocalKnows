[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# enforce trailing slashes, pick one and never change it
[[redirects]]
  from = "/nsw"
  to = "/nsw/"
  status = 301

[[redirects]]
  from = "/vic"
  to = "/vic/"
  status = 301
